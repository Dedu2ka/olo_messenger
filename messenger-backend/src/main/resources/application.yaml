server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_JDBC_URL:jdbc:postgresql://localhost:5432/messenger_db}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/messenger_db}
    username: ${SPRING_R2DBC_USERNAME}
    password: ${SPRING_R2DBC_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000 # 24 часа

app:
  web-push:
    public-key: ${WEB_PUSH_PUBLIC_KEY:}
    private-key: ${WEB_PUSH_PRIVATE_KEY:}
    subject: ${WEB_PUSH_SUBJECT:mailto:admin@olo-chat.duckdns.org}
  message-encryption-key-base64: ${MESSAGE_ENCRYPTION_KEY_BASE64}
  fcm:
    service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dedu2ka.github.io,http://localhost:3000}
